name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-pull BuildKit with retry
        run: |
          for i in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && break || sleep 5
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/apupro-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=/api/v1
            VITE_GOOGLE_CLIENT_ID=937416226275-bpkbct35f9ftercdj2nm4l9ugbnj1dhs.apps.googleusercontent.com
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/apupro-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 167.172.115.154
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            cd /root/apupro_platform
            set -e
            ENV_BACKUP=$(mktemp /tmp/apupro-backend-env.XXXXXX)
            if [ -f backend/.env ]; then
              cp backend/.env "$ENV_BACKUP"
              rm -f backend/.env
            fi
            restore_env() {
              if [ -f "$ENV_BACKUP" ]; then
                cp "$ENV_BACKUP" backend/.env
              fi
            }
            trap restore_env EXIT
            
            # Login to GitHub Container Registry using the GitHub token
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new code cleanly without git merge conflicts
            git fetch origin main
            git reset --hard origin/main
            restore_env
            
            # Pull the new images
            docker compose pull
            
            # Prevent container name collision conflicts (remove previous app containers cleanly)
            docker rm -f apupro_platform-apupro-backend-1 apupro_platform-apupro-frontend-1 || true
            
            # Restart containers with the new images
            docker compose up -d --remove-orphans
            
            # Free up disk space by removing unused dangling images
            docker image prune -f
