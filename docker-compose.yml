version: '3.8'

services:
  apupro-db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: apupro_user
      POSTGRES_PASSWORD: apupro_password
      POSTGRES_DB: apupro_db
    volumes:
      - apupro_db_data:/var/lib/postgresql/data
    ports:
      - "5440:5432"

  apupro-backend:
    image: ghcr.io/gynsys/apupro/apupro-backend:latest
    build: 
      context: ./backend
    restart: always
    ports:
      - "8010:8001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://apupro_user:apupro_password@apupro-db:5432/apupro_db
      - SECRET_KEY=changethisinproduction
    depends_on:
      - apupro-db
    volumes:
      - apupro_ai_brain:/app/ai_brain

  apupro-frontend:
    image: ghcr.io/gynsys/apupro/apupro-frontend:latest
    build:
      context: ./frontend
      args:
        - VITE_API_URL=https://costbase.net/api/v1
    restart: always
    ports:
      - "3010:80"

volumes:
  apupro_db_data:
  apupro_ai_brain:
